[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caracara-archicad-mcp"
version = "0.6.6"
description = "An extended MCP server for Archicad automation with script sandboxing, field masking, and polymorphic meta-verbs."
readme = "README.md"
authors = [
    { name = "SzamosiMate", email = "szamimate@yahoo.com" }
]
maintainers = [
    { name = "parikshit99" }
]
requires-python = ">=3.12, <3.15"
license = "MIT"

keywords = ["archicad", "bim", "automation", "api", "mcp", "ai", "llm", "caracara"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=2,<3",
    "multiconn-archicad==0.9.5",
    "uvicorn>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/parikshit99/caracara-archicad"
"Bug Tracker" = "https://github.com/parikshit99/caracara-archicad/issues"
"Upstream Repository" = "https://github.com/SzamosiMate/tapir-archicad-MCP"

[project.scripts]
archicad-server = "caracara_archicad_mcp.server:main"
caracara-server = "caracara_archicad_mcp.server:main"
tapir-archicad-mcp = "caracara_archicad_mcp.server:main"
caracara-archicad = "caracara_archicad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caracara_archicad_mcp"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
docstring-code-format = true
